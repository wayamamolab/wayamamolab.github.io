(() => {
  const dlg=document.getElementById('holidayZoom');
  const opener=document.getElementById('openHolidayPhoto');
  const close=document.getElementById('closeHolidayPhoto');
  opener.addEventListener('click',()=>{
    if(!dlg.querySelector('img')){
      const image=opener.querySelector('img').cloneNode(true);
      image.removeAttribute('loading');
      dlg.appendChild(image);
    }
    dlg.showModal();
  });
  close.addEventListener('click',()=>dlg.close());
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close();});
})();
